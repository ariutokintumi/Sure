<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SurePay – Email Composer</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 22px; }
    label { display:block; margin-top: 16px; font-weight: 600; }
    input { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; }
    .row { display:flex; gap:12px; }
    .row > div { flex:1; }
    button { margin-top: 16px; padding: 12px 16px; border: none; border-radius: 8px; cursor: pointer; }
    .primary { background: #111; color: #fff; }
    .muted { background: #eee; }
    .help { color:#555; font-size: 13px; }
    .card { border:1px solid #e5e5e5; padding:16px; border-radius:12px; margin-top:20px; }
  </style>
</head>
<body>
  <h1>SurePay – Email Payment Composer (Sepolia / USDC)</h1>

  <div class="card">
    <div class="row">
      <div>
        <label>Paymaster Email</label>
        <input id="paymaster" value="surepaymaster2049@gmail.com" />
      </div>
      <div>
        <label>Amount (USDC)</label>
        <input id="amount" type="number" step="0.000001" placeholder="e.g., 12.5" />
      </div>
    </div>
    <label>Recipient (email or 0x-address)</label>
    <input id="recipient" placeholder="alice@gmail.com or 0x..." />
    <button class="primary" onclick="makePayment()">Compose Payment Email</button>
  </div>

  <div class="card">
    <label>Quick Commands</label>
    <div class="row">
      <button class="muted" onclick="signup()">Signup</button>
      <button class="muted" onclick="balance()">Balance</button>
    </div>
  </div>

  <p class="help">The email will open in your client; review then send.</p>

<script>
function mailto(to, subject, body){
  const href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = href;
}

function makePayment(){
  const to = document.getElementById('paymaster').value.trim();
  const amt = document.getElementById('amount').value.trim();
  const rec = document.getElementById('recipient').value.trim();
  if(!to || !amt || !rec){ alert('Fill all fields.'); return; }
  const body = `Send ${amt} USDC to ${rec}`;
  mailto(to, 'payment', body);
}

function signup(){
  const to = document.getElementById('paymaster').value.trim();
  mailto(to, 'signup', '');
}

function balance(){
  const to = document.getElementById('paymaster').value.trim();
  mailto(to, 'balance', '');
}
</script>
</body>
</html>
